<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  body { margin: 0; background: #0A0B0F; }
  a { color: #3DDCFF; text-decoration: none; }
  a:hover { color: #8FEAFF; }
  @keyframes beamPulse { 0%,100% { opacity: .6 } 50% { opacity: 1 } }
</style>
</helmet>
<div style="width:390px;height:844px;position:relative;overflow:hidden;background:#0A0B0F;color:#E8EAF0;font-family:Inter,system-ui,sans-serif;display:flex;flex-direction:column">

  <div style="height:338px;flex:none;position:relative;overflow:hidden;border-bottom:1px solid rgba(255,255,255,0.08);background:radial-gradient(130% 100% at 50% 24%, #12141C 0%, #0A0B0F 70%)">

    <div style="position:absolute;top:16px;left:20px;right:20px;display:flex;align-items:center;justify-content:space-between">
      <div style="font-family:'Instrument Serif',serif;font-size:24px;line-height:1.2">1. Two Sum</div>
      <div style="display:inline-flex;align-items:center;gap:8px;padding:6px 14px;border-radius:999px;background:#14161D;border:1px solid rgba(255,255,255,0.08);font-family:'JetBrains Mono',monospace;font-size:13px;letter-spacing:.08em">
        <span style="width:5px;height:5px;border-radius:999px;background:#3DDCFF;box-shadow:0 0 10px rgba(61,220,255,0.9)"></span>
        <span style="color:#E8EAF0">7</span><span style="color:#8B93A7">/ 24</span>
      </div>
    </div>

    <div style="position:absolute;inset:0;perspective:820px;perspective-origin:50% 46%">
      <div style="position:absolute;left:50%;top:34%;transform:translate(-50%,-50%) translateZ(-260px);display:grid;grid-template-columns:repeat(6,44px);grid-auto-rows:22px;gap:8px">
        <sc-for list="{{ slots }}" as="s" hint-placeholder-count="12">
          <div style="border-radius:5px;background:{{ s.bg }};border:1px solid {{ s.border }};box-shadow:{{ s.glow }}"></div>
        </sc-for>
      </div>

      <div style="position:absolute;left:50%;top:70%;transform:translate(-50%,-50%) rotateX(52deg);transform-style:preserve-3d">
        <div style="display:flex;gap:12px">
          <sc-for list="{{ tiles }}" as="t" hint-placeholder-count="6">
            <div style="width:50px;height:50px;border-radius:10px;background:{{ t.bg }};border:1px solid {{ t.border }};box-shadow:{{ t.glow }}"></div>
          </sc-for>
        </div>
      </div>
    </div>

    <div style="position:absolute;left:50%;top:37%;margin-left:-30px;width:2px;height:96px;background:linear-gradient(rgba(167,139,250,0.9),#3DDCFF);box-shadow:0 0 20px rgba(61,220,255,0.7);border-radius:999px;animation:beamPulse 2.4s ease-in-out infinite"></div>

    <div style="position:absolute;left:0;right:0;bottom:26px;display:flex;justify-content:center;gap:12px;font-family:'JetBrains Mono',monospace;font-size:13px">
      <sc-for list="{{ labels }}" as="l" hint-placeholder-count="6">
        <div style="width:50px;text-align:center;color:{{ l.color }}">{{ l.v }}</div>
      </sc-for>
    </div>
    <div style="position:absolute;left:0;right:0;bottom:8px;display:flex;justify-content:center;gap:12px;font-family:'JetBrains Mono',monospace;font-size:13px">
      <sc-for list="{{ idxLabels }}" as="l" hint-placeholder-count="6">
        <div style="width:50px;text-align:center;color:{{ l.color }}">{{ l.v }}</div>
      </sc-for>
    </div>
  </div>

  <div style="flex:none;padding:14px 20px;border-bottom:1px solid rgba(255,255,255,0.08);font-size:14px;line-height:1.5;color:#8B93A7;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">11's complement is −2 — not in the map yet.</div>

  <div style="flex:1;min-height:0;overflow-y:auto;padding:12px 0 8px">
    <sc-for list="{{ lines }}" as="ln" hint-placeholder-count="12">
      <div style="display:grid;grid-template-columns:40px 1fr;align-items:center;height:26px;background:{{ ln.bg }};border-left:2px solid {{ ln.mark }}">
        <div style="font-family:'JetBrains Mono',monospace;font-size:13px;color:{{ ln.numColor }};text-align:right;padding-right:12px">{{ ln.n }}</div>
        <div style="font-family:'JetBrains Mono',monospace;font-size:13px;line-height:1.6;white-space:pre;color:#8B93A7">{{ ln.code }}</div>
      </div>
    </sc-for>
  </div>

  <div style="flex:none;background:#0A0B0F">
    <div style="display:flex;flex-direction:column;align-items:center;gap:8px;padding:10px 0 12px;border-top:1px solid rgba(255,255,255,0.08);cursor:pointer">
      <div style="width:36px;height:4px;border-radius:999px;background:rgba(255,255,255,0.18)"></div>
      <div style="font-family:'JetBrains Mono',monospace;font-size:13px;letter-spacing:.12em;color:#8B93A7">VARIABLES</div>
    </div>

    <div style="border-top:1px solid rgba(255,255,255,0.08);background:#14161D;padding:16px 20px 34px;display:flex;flex-direction:column;gap:16px">
      <div style="position:relative;height:6px;border-radius:999px;background:rgba(255,255,255,0.08)">
        <div style="position:absolute;left:0;top:0;bottom:0;width:29.2%;border-radius:999px;background:#3DDCFF;box-shadow:0 0 18px rgba(61,220,255,0.55)"></div>
        <div style="position:absolute;left:29.2%;top:50%;width:14px;height:14px;margin-left:-7px;margin-top:-7px;border-radius:999px;background:#0A0B0F;border:2px solid #3DDCFF;box-shadow:0 0 16px rgba(61,220,255,0.75)"></div>
      </div>
      <div style="display:flex;align-items:center;justify-content:space-between">
        <button style="width:46px;height:46px;border-radius:999px;background:transparent;border:1px solid rgba(255,255,255,0.08);color:#8B93A7;display:flex;align-items:center;justify-content:center;cursor:pointer">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M3 8a5 5 0 105-5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"></path><path d="M3 4.5V8h3.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path></svg>
        </button>
        <button style="width:46px;height:46px;border-radius:999px;background:transparent;border:1px solid rgba(255,255,255,0.08);color:#8B93A7;display:flex;align-items:center;justify-content:center;cursor:pointer">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M10 3L5 8l5 5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path></svg>
        </button>
        <button style="width:60px;height:60px;border-radius:999px;background:rgba(61,220,255,0.14);border:1px solid rgba(61,220,255,0.55);color:#3DDCFF;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 0 28px rgba(61,220,255,0.35)">
          <svg width="18" height="18" viewBox="0 0 16 16" fill="none"><rect x="4" y="3.5" width="2.6" height="9" rx="1" fill="currentColor"></rect><rect x="9.4" y="3.5" width="2.6" height="9" rx="1" fill="currentColor"></rect></svg>
        </button>
        <button style="width:46px;height:46px;border-radius:999px;background:transparent;border:1px solid rgba(255,255,255,0.08);color:#8B93A7;display:flex;align-items:center;justify-content:center;cursor:pointer">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M6 3l5 5-5 5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path></svg>
        </button>
        <button style="height:46px;padding:0 18px;border-radius:999px;background:transparent;border:1px solid rgba(255,255,255,0.08);color:#8B93A7;font-family:'JetBrains Mono',monospace;font-size:13px;cursor:pointer">1.5x</button>
      </div>
    </div>
  </div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:844}}">
class Component extends DCLogic {
  renderVals() {
    const src = [
      "function twoSum(nums, target) {",
      "  const seen = new Map();",
      "",
      "  for (let i = 0; i < n; i++) {",
      "    const c = target - nums[i];",
      "",
      "    if (seen.has(c)) {",
      "      return [seen.get(c), i];",
      "    }",
      "",
      "    seen.set(nums[i], i);",
      "  }"
    ];
    const active = 5;
    const lines = src.map((code, i) => {
      const n = i + 1, on = n === active;
      return {
        n: String(n),
        code: code === "" ? " " : code,
        bg: on ? "rgba(61,220,255,0.07)" : "transparent",
        mark: on ? "#3DDCFF" : "transparent",
        numColor: on ? "#3DDCFF" : "rgba(139,147,167,0.6)"
      };
    });

    const values = [2, 7, 11, 15, 3, 6];
    const activeTile = 2;
    const paint = {
      idle:   { bg: "rgba(255,255,255,0.04)", border: "rgba(255,255,255,0.10)", glow: "none" },
      done:   { bg: "rgba(167,139,250,0.14)", border: "rgba(167,139,250,0.40)", glow: "0 0 20px rgba(167,139,250,0.25)" },
      active: { bg: "rgba(61,220,255,0.20)",  border: "rgba(61,220,255,0.70)",  glow: "0 0 34px rgba(61,220,255,0.60)" }
    };

    const slotFilled = [1, 6];
    return {
      lines,
      tiles: values.map((v, i) => paint[i === activeTile ? "active" : (i < activeTile ? "done" : "idle")]),
      labels: values.map((v, i) => ({
        v: String(v),
        color: i === activeTile ? "#3DDCFF" : (i < activeTile ? "#C4B2FD" : "#8B93A7")
      })),
      idxLabels: values.map((v, i) => ({
        v: String(i),
        color: i === activeTile ? "rgba(61,220,255,0.7)" : "rgba(139,147,167,0.5)"
      })),
      slots: Array.from({ length: 12 }, (_, i) =>
        slotFilled.indexOf(i) >= 0
          ? { bg: "rgba(167,139,250,0.16)", border: "rgba(167,139,250,0.45)", glow: "0 0 18px rgba(167,139,250,0.30)" }
          : { bg: "rgba(255,255,255,0.03)", border: "rgba(255,255,255,0.08)", glow: "none" }
      )
    };
  }
}
</script>
</body>
</html>
