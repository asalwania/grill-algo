<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  body { margin: 0; background: #0A0B0F; }
  a { color: #3DDCFF; text-decoration: none; }
  a:hover { color: #8FEAFF; }
</style>
</helmet>
<div style="width:1440px;height:900px;overflow:hidden;background:#0A0B0F;color:#E8EAF0;font-family:Inter,system-ui,sans-serif;display:flex;flex-direction:column">

  <div style="flex:none;display:flex;align-items:center;justify-content:space-between;padding:22px 72px;border-bottom:1px solid rgba(255,255,255,0.08)">
    <div style="font-family:'JetBrains Mono',monospace;font-size:13px;letter-spacing:.14em;color:#8B93A7">EXECUTION VISUALIZER</div>
    <div style="display:flex;gap:28px;font-size:14px;color:#8B93A7">
      <span style="color:#E8EAF0">Problems</span>
      <span style="cursor:pointer;transition:color .16s ease" style-hover="color:#E8EAF0">Patterns</span>
      <span style="cursor:pointer;transition:color .16s ease" style-hover="color:#E8EAF0">About</span>
    </div>
  </div>

  <div style="flex:none;padding:72px 72px 0;display:flex;flex-direction:column;gap:14px">
    <h1 style="font-family:'Instrument Serif',serif;font-size:48px;line-height:1.1;font-weight:400;margin:0;letter-spacing:-0.01em">Watch algorithms think.</h1>
    <p style="margin:0;font-size:16px;line-height:1.55;color:#8B93A7;max-width:640px">Step through real execution, one frame at a time — no guessing, no hand-waving.</p>
  </div>

  <div style="flex:1;min-height:0;padding:64px 72px 56px;display:grid;grid-template-columns:repeat(3,1fr);grid-auto-rows:1fr;gap:28px">

    <div style="border:1px solid rgba(61,220,255,0.45);border-radius:14px;background:rgba(20,22,29,0.72);backdrop-filter:blur(18px);padding:26px 28px;display:flex;flex-direction:column;gap:20px;cursor:pointer;box-shadow:0 0 40px rgba(61,220,255,0.14)">
      <div style="display:flex;align-items:flex-end;gap:8px;height:52px">
        <div style="width:34px;height:34px;border-radius:7px;background:rgba(167,139,250,0.16);border:1px solid rgba(167,139,250,0.42)"></div>
        <div style="width:34px;height:34px;border-radius:7px;background:rgba(167,139,250,0.16);border:1px solid rgba(167,139,250,0.42)"></div>
        <div style="width:34px;height:52px;border-radius:7px;background:rgba(61,220,255,0.18);border:1px solid rgba(61,220,255,0.6);box-shadow:0 0 24px rgba(61,220,255,0.4)"></div>
        <div style="width:34px;height:34px;border-radius:7px;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.10)"></div>
        <div style="width:34px;height:34px;border-radius:7px;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.10)"></div>
      </div>
      <div style="display:flex;flex-direction:column;gap:8px;flex:1">
        <div style="font-family:'Instrument Serif',serif;font-size:24px;line-height:1.25">1. Two Sum</div>
        <div style="font-size:14px;line-height:1.6;color:#8B93A7">One pass, one map — trade memory for time.</div>
      </div>
      <div style="display:flex;gap:8px">
        <span style="font-family:'JetBrains Mono',monospace;font-size:13px;letter-spacing:.1em;padding:5px 12px;border-radius:999px;color:#86EFAC;background:rgba(74,222,128,0.1);border:1px solid rgba(74,222,128,0.35)">EASY</span>
        <span style="font-family:'JetBrains Mono',monospace;font-size:13px;letter-spacing:.1em;padding:5px 12px;border-radius:999px;color:#C4B2FD;background:rgba(167,139,250,0.1);border:1px solid rgba(167,139,250,0.35)">HASH MAP</span>
      </div>
    </div>

    <sc-for list="{{ placeholders }}" as="p" hint-placeholder-count="5">
      <div style="border:1px solid rgba(255,255,255,0.08);border-radius:14px;background:rgba(20,22,29,0.5);padding:26px 28px;display:flex;flex-direction:column;gap:20px">
        <div style="display:flex;align-items:flex-end;gap:8px;height:52px;opacity:.45">
          <div style="width:34px;height:{{ p.a }};border-radius:7px;background:rgba(255,255,255,0.035);border:1px solid rgba(255,255,255,0.08)"></div>
          <div style="width:34px;height:{{ p.b }};border-radius:7px;background:rgba(255,255,255,0.035);border:1px solid rgba(255,255,255,0.08)"></div>
          <div style="width:34px;height:{{ p.c }};border-radius:7px;background:rgba(255,255,255,0.035);border:1px solid rgba(255,255,255,0.08)"></div>
          <div style="width:34px;height:{{ p.d }};border-radius:7px;background:rgba(255,255,255,0.035);border:1px solid rgba(255,255,255,0.08)"></div>
          <div style="width:34px;height:{{ p.e }};border-radius:7px;background:rgba(255,255,255,0.035);border:1px solid rgba(255,255,255,0.08)"></div>
        </div>
        <div style="display:flex;flex-direction:column;gap:12px;flex:1">
          <div style="height:16px;width:58%;border-radius:4px;background:rgba(255,255,255,0.07)"></div>
          <div style="height:10px;width:88%;border-radius:4px;background:rgba(255,255,255,0.045)"></div>
        </div>
        <div style="display:flex;gap:8px">
          <div style="height:26px;width:74px;border-radius:999px;border:1px solid rgba(255,255,255,0.07)"></div>
          <div style="height:26px;width:104px;border-radius:999px;border:1px solid rgba(255,255,255,0.07)"></div>
        </div>
      </div>
    </sc-for>

  </div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:900}}">
class Component extends DCLogic {
  renderVals() {
    const shapes = [
      ["30px","44px","30px","30px","30px"],
      ["24px","34px","44px","34px","24px"],
      ["44px","30px","30px","44px","30px"],
      ["30px","30px","52px","30px","30px"],
      ["34px","34px","34px","52px","34px"]
    ];
    return {
      placeholders: shapes.map(s => ({ a: s[0], b: s[1], c: s[2], d: s[3], e: s[4] }))
    };
  }
}
</script>
</body>
</html>
